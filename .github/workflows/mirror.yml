name: mirror upstream pstack

# Re-ports pstack from cursor/plugins and commits the result.
#
# port/verify.mjs checks the result. When upstream introduces a Cursor-ism no rule
# covers, verify fails, nothing is pushed, and an issue is opened naming the
# file and line. A stale mirror is recoverable; a mirror that silently ships
# instructions pointing at ~/.cursor paths is not.

on:
  schedule:
    - cron: '17 6 * * *' # daily, 06:17 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: 'Upstream ref to port (default: main)'
        required: false
        default: 'main'
  push:
    branches: [main]
    paths:
      - 'port/**' # a rule or overlay change must re-generate the output
      - '.github/workflows/mirror.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # shell: bash is required, not cosmetic. The default shell lacks pipefail,
      # so `node ... | tee` would report tee's exit status and a failing verify
      # would pass the step and a broken port would publish.
      - name: Re-port from upstream
        id: sync
        shell: bash
        run: node port/sync.mjs --ref "${{ inputs.ref || 'main' }}" | tee sync.log

      # Staged before verify, not after, so verify's executable-bit check reads
      # the modes this run actually produced. sync.mjs chmods on Linux, `git add`
      # records 100755, and a script upstream newly marks executable is checked
      # here rather than one run later.
      - name: Stage the regenerated port
        shell: bash
        run: git add -A pstack UPSTREAM.json

      - name: Verify the port
        id: verify
        shell: bash
        run: node port/verify.mjs | tee verify.log

      - name: Detect changes
        id: diff
        shell: bash
        run: |
          # status, not diff: a new upstream skill arrives as an untracked
          # directory, which `git diff` reports as clean.
          if [ -z "$(git status --porcelain -- pstack UPSTREAM.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "port is already current"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "upstream=$(jq -r '.upstream.commit' UPSTREAM.json)"
              echo "version=$(jq -r '.plugin.version' UPSTREAM.json)"
            } >> "$GITHUB_OUTPUT"
            git status --porcelain -- pstack UPSTREAM.json
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        env:
          UPSTREAM_SHA: ${{ steps.diff.outputs.upstream }}
          PLUGIN_VERSION: ${{ steps.diff.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pstack UPSTREAM.json
          # -F keeps the body column-zero; an inline -m string inside a YAML
          # block would carry this file's indentation into the commit message.
          printf '%s\n\n%s\n%s\n%s\n\n%s\n' \
            "chore(mirror): pstack v${PLUGIN_VERSION} from cursor/plugins@${UPSTREAM_SHA:0:7}" \
            "Generated by port/sync.mjs. Do not edit ./pstack by hand: the tree is" \
            "rebuilt from scratch every run, so edits are lost. Change a rule in" \
            "port/rules.mjs or an overlay in port/overlays/ instead." \
            "Upstream: https://github.com/cursor/plugins/commit/${UPSTREAM_SHA}" \
            > /tmp/mirror-commit-msg
          git commit -F /tmp/mirror-commit-msg
          git push

      # A failed verify means upstream added something the ruleset does not
      # understand. Surface it as an issue rather than letting the mirror go
      # quietly stale.
      - name: Report a blocked mirror
        if: failure() && steps.sync.outcome == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const read = (f) => { try { return fs.readFileSync(f, 'utf8'); } catch { return '(no output)'; } };
            const title = 'mirror blocked: upstream introduced an unported pattern';
            const body = [
              '`port/verify.mjs` rejected the generated port, so nothing was published.',
              '',
              'Add a rule to `port/rules.mjs` (or an allowlist entry with a reason in',
              '`port/verify.mjs`), then re-run this workflow.',
              '',
              '<details><summary>verify output</summary>',
              '',
              '```',
              read('verify.log').slice(-8000),
              '```',
              '</details>',
              '',
              '<details><summary>sync output</summary>',
              '',
              '```',
              read('sync.log').slice(-4000),
              '```',
              '</details>',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'mirror-blocked',
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['mirror-blocked'],
              });
            }
